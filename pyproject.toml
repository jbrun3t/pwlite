[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwlite"
version = "0.2.0"
description = "A small client for the Patchwork REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = ["ruff~=0.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["pwlite"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
